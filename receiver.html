<!doctype html>
<!--
  ClimbWall - Custom Google Cast Web Receiver.

  Register THIS page's public HTTPS URL as your receiver's "Receiver Application URL" in the
  Google Cast SDK Developer Console (the console gives you the App ID for frontend/src/cast.js).

  Messages from the phone on CAST_NAMESPACE (JSON):
    { state: "markers", markers: [[x,y] x4] }
    { state: "idle",  holds: [...], calibrated, wall_outline, image_url?, image_width?, image_height? }
    { state: "route", holds: [...], route_holds: [{hold_id, role, polygon}], ...same extras }
    { state: "geometry", holds: [...], append: bool }   preload polygons only (64KB Cast limit)
    { state: "blank" }
  A hold is { hold_id, polygon: [[x,y],...], role? }.

  How it stays in sync and fast:
    * There are only THREE hold layers: one idle layer and two route layers (A/B).
    * Each layer is ONE opacity-faded <div> (GPU-composited). All holds in a layer therefore
      appear/disappear at exactly the same instant - there are no per-hold transitions.
    * Each layer draws its holds as a handful of <path> elements (idle: 1, route: 1 per role),
      not one element per hold, so the DOM is tiny and painted once.
    * idle  : the idle layer fades in; its inner <svg> pulses (a separate compositor animation).
    * route : idle fades out while the route layer fades in (steady, no pulse). Selecting another
              route fills the OTHER route layer while hidden, then cross-fades A <-> B.

  Local testing: open receiver.html?dev=1 and call climbReceiver.apply({...}) from the console.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>ClimbWall</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --fade: 0.4s;             /* fade in / fade out of a whole layer */
    --idle-period: 3.8s;      /* one idle pulse */
    --idle-min: 0.55;         /* dimmest point of the idle pulse */
  }

  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }

  #hint {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 18px 24px; text-align: center;
    font: 22px/1.3 system-ui, sans-serif; color: #a3abbb; transition: opacity 0.8s;
  }
  #hint.gone { opacity: 0; pointer-events: none; }

  .stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* Backdrop elements */
  .fade { opacity: 0; transition: opacity 0.4s linear; }
  .fade.on { opacity: 1; }
  #outline { fill: none; stroke: #5a5a64; stroke-width: 2; vector-effect: non-scaling-stroke; }
  .marker-dot { fill: #fff; }
  .marker-label { fill: #fff; font: 700 0.03px sans-serif; text-anchor: middle; dominant-baseline: middle; }

  /* Hold layers: the only thing that ever animates on a state change is this opacity. */
  .layer {
    position: fixed; inset: 0; opacity: 0; will-change: opacity;
    transition: opacity var(--fade) linear;
  }
  .layer.on { opacity: 1; }

  /* Idle pulse lives on the inner svg so it never fights the layer's fade. */
  .pulse { animation: idle-pulse var(--idle-period) ease-in-out infinite; will-change: opacity; }
  @keyframes idle-pulse { 0%, 100% { opacity: var(--idle-min); } 50% { opacity: 1; } }

  path { vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .idle-poly { fill: #fff; fill-opacity: 0.3; stroke: #fff; stroke-width: 3; }
  .route-poly { fill: var(--c); fill-opacity: 0.45; stroke: var(--c); stroke-width: 5; }
  .role-start { --c: #7ed957; }
  .role-hold  { --c: #f2c230; }
  .role-foot  { --c: #7fd6ff; }
  .role-end   { --c: #ff6ec7; }
</style>
</head>
<body>
<svg id="stage" class="stage" viewBox="0 0 1 1" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <image id="photo" class="fade" x="0" y="0" width="1" height="1" preserveAspectRatio="none"/>
  <g class="space">
    <polygon id="outline" class="fade"/>
  </g>
  <g id="markers" class="fade"></g>
</svg>
<!-- Hold layers are built by script (see makeLayer). -->
<p id="hint">Loading…</p>

<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script>
(() => {
  // Must match CAST_NAMESPACE in frontend/src/cast.js.
  const CAST_NAMESPACE = "urn:x-cast:com.climbwall.projector";
  const SVG_NS = "http://www.w3.org/2000/svg";
  const DEFAULT_MARKERS = [[0.05, 0.05], [0.95, 0.05], [0.95, 0.95], [0.05, 0.95]];
  const ROLES = ["start", "hold", "foot", "end"];

  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), photo = $("photo"), outline = $("outline");
  const markersLayer = $("markers"), hint = $("hint");

  function svg(tag, attrs = {}) {
    const el = document.createElementNS(SVG_NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  /** A faded <div> holding one <svg> with one <path> per class in `pathClasses`. */
  function makeLayer(pathClasses, pulse) {
    const el = document.createElement("div");
    el.className = "layer";
    const s = svg("svg", { class: "stage" + (pulse ? " pulse" : ""), viewBox: "0 0 1 1", preserveAspectRatio: "none" });
    const g = svg("g", { class: "space" });
    const paths = {};
    for (const key in pathClasses) {
      paths[key] = svg("path", { class: pathClasses[key] });
      g.appendChild(paths[key]);
    }
    s.appendChild(g);
    el.appendChild(s);
    document.body.insertBefore(el, hint);
    return { el, paths, d: {} , key: "" };
  }

  const idle = makeLayer({ all: "idle-poly" }, true);
  const routeClasses = {};
  for (const r of ROLES) routeClasses[r] = `route-poly role-${r}`;
  const routes = [makeLayer(routeClasses, false), makeLayer(routeClasses, false)];
  let activeRoute = -1;       // index in `routes` of the route layer currently/last shown

  const stages = document.querySelectorAll(".stage");
  const spaces = document.querySelectorAll(".space");

  let geo = new Map();        // hold_id -> polygon (cached shapes, see "geometry" state)
  let idleDirty = false;      // geo changed since the idle path was last built
  let markersKey = "";

  const polyD = (poly) => {
    let s = "M" + poly[0][0] + " " + poly[0][1];
    for (let i = 1; i < poly.length; i++) s += "L" + poly[i][0] + " " + poly[i][1];
    return s + "Z";
  };
  const ptsStr = (poly) => poly.map((p) => `${p[0]},${p[1]}`).join(" ");

  // ---------- layer switching (all opacity, all at once) ----------
  function idleOn(on) { idle.el.classList.toggle("on", on); }
  function routesOff() { for (const r of routes) r.el.classList.remove("on"); }
  function hideHolds() { idleOn(false); routesOff(); }

  function showIdle() {
    if (idleDirty) {
      let d = "";
      for (const poly of geo.values()) d += polyD(poly);
      idle.paths.all.setAttribute("d", d);
      idleDirty = false;
    }
    routesOff();
    idleOn(true);
  }

  function showRoute(byRole) {
    const ds = {};
    let key = "";
    for (const r of ROLES) { ds[r] = byRole[r] || ""; key += ds[r] + "|"; }
    const cur = routes[activeRoute];
    if (!cur || cur.key !== key) {
      // Fill the hidden layer, then cross-fade. The other layer is not touched until it fades out.
      const nextIdx = activeRoute === 0 ? 1 : 0;
      const next = routes[nextIdx];
      for (const r of ROLES) next.paths[r].setAttribute("d", ds[r]);
      next.key = key;
      next.el.classList.add("on");
      if (cur) cur.el.classList.remove("on");
      activeRoute = nextIdx;
    } else {
      cur.el.classList.add("on");
    }
    idleOn(false);
  }

  // ---------- states ----------
  function setStageSpace(aspect) {
    // Calibrated: projector output space stretched to fill the screen.
    // Uncalibrated fallback: wall photo letterboxed at its own aspect, holds drawn over it.
    const vb = aspect ? `0 0 ${aspect} 1` : "0 0 1 1";
    const par = aspect ? "xMidYMid meet" : "none";
    for (const el of stages) { el.setAttribute("viewBox", vb); el.setAttribute("preserveAspectRatio", par); }
    for (const el of spaces) {
      if (aspect) el.setAttribute("transform", `scale(${aspect} 1)`);
      else el.removeAttribute("transform");
    }
    if (aspect) photo.setAttribute("width", aspect);
  }

  function showWall(msg) {
    const routeMode = msg.state === "route";

    if (Array.isArray(msg.holds)) {
      const next = new Map();
      for (const h of msg.holds) {
        const poly = h.polygon || geo.get(h.hold_id);
        if (poly) next.set(h.hold_id, poly);
      }
      geo = next;
      idleDirty = true;
    }

    // Backdrop.
    const hasPhoto = msg.calibrated === false && msg.image_url && msg.image_width && msg.image_height;
    if (hasPhoto) {
      setStageSpace(msg.image_width / msg.image_height);
      if (photo.getAttribute("href") !== msg.image_url) photo.setAttribute("href", msg.image_url);
      photo.classList.add("on");
    } else {
      setStageSpace(null);
      photo.classList.remove("on");
    }
    if (msg.calibrated !== false && Array.isArray(msg.wall_outline) && msg.wall_outline.length > 2) {
      outline.setAttribute("points", ptsStr(msg.wall_outline));
      outline.classList.add("on");
    } else {
      outline.classList.remove("on");
    }
    markersLayer.classList.remove("on");

    if (!routeMode) { showIdle(); return; }

    const byRole = {};
    for (const rh of msg.route_holds || []) {
      const poly = rh.polygon || geo.get(rh.hold_id);
      if (!poly || !ROLES.includes(rh.role)) continue;
      byRole[rh.role] = (byRole[rh.role] || "") + polyD(poly);
    }
    showRoute(byRole);
  }

  function showMarkers(msg) {
    setStageSpace(null);
    photo.classList.remove("on");
    outline.classList.remove("on");
    hideHolds();

    const list = Array.isArray(msg.markers) && msg.markers.length ? msg.markers : DEFAULT_MARKERS;
    const key = JSON.stringify(list);
    if (key !== markersKey) {
      markersKey = key;
      markersLayer.replaceChildren();
      list.forEach(([x, y], i) => {
        markersLayer.appendChild(svg("circle", { cx: x, cy: y, r: 0.02, class: "marker-dot" }));
        const t = svg("text", { x, y: y - 0.035, class: "marker-label" });
        t.textContent = String(i + 1);
        markersLayer.appendChild(t);
      });
    }
    markersLayer.classList.add("on");
  }

  function blank() {
    hideHolds();
    photo.classList.remove("on");
    outline.classList.remove("on");
    markersLayer.classList.remove("on");
  }

  function loadGeometry(msg) {
    if (!msg.append) geo = new Map();
    for (const h of msg.holds || []) if (h.polygon) geo.set(h.hold_id, h.polygon);
    idleDirty = true;
  }

  function apply(msg) {
    switch (msg.state) {
      case "geometry": loadGeometry(msg); return;
      case "markers": hint.classList.add("gone"); showMarkers(msg); return;
      case "idle":
      case "route": hint.classList.add("gone"); showWall(msg); return;
      case "blank": hint.classList.add("gone"); blank(); return;
      default: console.warn("ClimbWall receiver: unknown state", msg.state);
    }
  }

  function onMessage(event) {
    let msg = event.data;
    if (typeof msg === "string") { try { msg = JSON.parse(msg); } catch { return; } }
    if (!msg || typeof msg !== "object") return;
    try { apply(msg); } catch (e) { console.error("ClimbWall receiver: bad message", e, msg); }
  }

  window.climbReceiver = { apply };

  // ---------- Cast wiring ----------
  const dev = new URLSearchParams(location.search).has("dev");
  if (dev || !window.cast?.framework) {
    console.info("ClimbWall receiver in dev mode - call climbReceiver.apply({state: ...})");
    return;
  }
  const ctx = cast.framework.CastReceiverContext.getInstance();
  ctx.addCustomMessageListener(CAST_NAMESPACE, onMessage);
  // Phone pressed "Disconnect": stop the app so the TV returns to its home screen.
  ctx.addEventListener(cast.framework.system.EventType.SENDER_DISCONNECTED, (e) => {
    if (ctx.getSenders().length === 0 &&
        e.reason === cast.framework.system.DisconnectReason.REQUESTED_BY_SENDER) ctx.stop();
  });
  const options = new cast.framework.CastReceiverOptions();
  options.disableIdleTimeout = true;
  options.customNamespaces = { [CAST_NAMESPACE]: cast.framework.system.MessageType.JSON };
  ctx.start(options);
})();
</script>
</body>
</html>
